     <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/177222217">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f1115; /* Deeper dark background */
            background-image: radial-gradient(circle at 50% 50%, #1a1e27 0%, #0f1115 100%);
            margin: 0;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Loading Spinner - OriginOS Style */
        .loader {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.05);
            border-left-color: #3b82f6; 
            border-right-color: #8b5cf6;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        /* Custom scrollbar - Hidden */
        .model-selector-container::-webkit-scrollbar {
            height: 0px; 
            display: none; 
        }
        .model-selector-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Spring Animations */
        @keyframes slideInDown {
            0% { transform: translate(-50%, -150%); opacity: 0; }
            70% { transform: translate(-50%, 10%); opacity: 1; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast-enter {
            animation: slideInDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes slideInRight {
            0% { transform: translateX(150%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .toolbar-enter {
            animation: slideInRight 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes popUp {
            0% { transform: scale(0.8) translate(-50%, 50%); opacity: 0; }
            100% { transform: scale(1) translate(-50%, 0); opacity: 1; }
        }
        .anim-ctrl-enter {
            animation: popUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        /* Drag cursors */
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing !important; }

        /* Tooltip styling */
        .tool-btn { position: relative; }
        .tool-btn:hover .tooltip { opacity: 1; visibility: visible; transform: translate(-100%, -50%) scale(1); }
        .tooltip {
            position: absolute;
            right: 120%;
            top: 50%;
            transform: translate(-90%, -50%) scale(0.9);
            background: rgba(0,0,0,0.8);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        
        /* Zen Mode UI Hiding */
        .ui-hidden .hideable {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            transform: scale(0.95) !important;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }
        .hideable {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Dragging state for Zen Button */
        .dragging {
            transition: none !important;
            transform: scale(1.1) !important;
            cursor: grabbing !important;
        }
    </style>
</head>

            { name: 'Leef 31', url: GITHUB_REPO_URL + 'Leef_31.glb' },
            { name: 'Loptop', url: GITHUB_REPO_URL + 'Loptop.glb' },
            { name: 'Loptop 001', url: GITHUB_REPO_URL + 'Loptop_001.glb' },
            { name: 'MOBIL', url: GITHUB_REPO_URL + 'MOBIL.glb' },
            { name: 'New Mobile', url: GITHUB_REPO_URL + 'New_Mobile.glb' },            
            { name: 'S24', url: GITHUB_REPO_URL + 'S24.glb' },
            { name: 'Monitor', url: GITHUB_REPO_URL + 'SanStudi%20Moniter_v1.glb' },
            { name: 'Scall', url: GITHUB_REPO_URL + 'Scall.glb' },
            { name: 'Sword', url: GITHUB_REPO_URL + 'Sword.glb' },
            { name: 'THE CLASS', url: GITHUB_REPO_URL + 'THE%20CLASS.glb' },
            { name: 'THE ROOM', url: GITHUB_REPO_URL + 'THE%20ROOM.glb' },
            { name: 'Tank', url: GITHUB_REPO_URL + 'Tank.glb' },
            { name: 'Car 1', url: GITHUB_REPO_URL + 'car1.glb' },
            { name: 'Charger', url: GITHUB_REPO_URL + 'charger.glb' },
            { name: 'House Test', url: GITHUB_REPO_URL + 'house%20test.glb' },
            { name: 'House Test 1', url: GITHUB_REPO_URL + 'house%20test1.glb' },
            { name: 'House', url: GITHUB_REPO_URL + 'house.glb' },
            { name: 'Laptop', url: GITHUB_REPO_URL + 'laptop.glb' },
            { name: 'Lighthouse', url: GITHUB_REPO_URL + 'lightouse.glb' },
            { name: 'Modul', url: GITHUB_REPO_URL + 'modul.glb' },
            { name: 'Safe', url: GITHUB_REPO_URL + 'safe.glb' },
            { name: 'Sniper', url: GITHUB_REPO_URL + 'sniper.glb' },
            { name: 'Village', url: GITHUB_REPO_URL + 'villag.glb' },
            { name: 'Wind Mill', url: GITHUB_REPO_URL + 'wind%20mill.glb' },
            { name: 'Thor', url: GITHUB_REPO_URL + 'Thor.glb' }
        ];

        // UI Elements
        const canvasContainer = document.getElementById('canvas-container');
        const loaderElement = document.getElementById('loader');
        const modelSelector = document.getElementById('model-selector');
        const errorToast = document.getElementById('error-toast');
        const errorMessage = document.getElementById('error-message');
        const statTris = document.getElementById('stat-tris');
        const statObjs = document.getElementById('stat-objs');
        const statsPanel = document.getElementById('model-stats');
        const animController = document.getElementById('anim-controller');
        
        let scene, camera, renderer, controls, model, mixer, activeAction;
        let pmremGenerator, envTexture, basicLights = [];
        let gridHelper, axesHelper;
        
        // HDRI Data - Switched to GitHub CDN source since NPM package excludes textures
        const HDR_BASE = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r164/examples/textures/equirectangular/';
        const hdrEnvironments = [
            { id: 'studio', name: 'Studio (Default)', url: null, type: 'room' },
            { id: 'venice', name: 'Venice Sunset', url: HDR_BASE + 'venice_sunset_1k.hdr', type: 'hdr' },
            { id: 'royal', name: 'Royal Esplanade', url: HDR_BASE + 'royal_esplanade_1k.hdr', type: 'hdr' },
            { id: 'overpass', name: 'Overpass', url: HDR_BASE + 'pedestrian_overpass_1k.hdr', type: 'hdr' },
            { id: 'none', name: 'None (Basic Lights)', url: null, type: 'none' }
        ];
        
        // State
        const state = {
            wireframe: false,
            grid: false,
            currentEnv: 'overpass',
            isHdrPanelOpen: false,
            isPlaying: true
        };
        const clock = new THREE.Clock();

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.outputColorSpace = THREE.SRGBColorSpace; 
            canvasContainer.appendChild(renderer.domElement);

            // Setup Realistic Environment (Blender Style)
            pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();
            envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
            // scene.environment is now handled by loadEnvironment() below

            // Setup Basic Lighting (Fallback)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 10, 7.5);
            const pointLight = new THREE.PointLight(0xADD8E6, 2, 100);
            pointLight.position.set(-5, -5, 5);
            basicLights = [ambientLight, directionalLight, pointLight];

            // Setup Helpers
            gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
            gridHelper.position.y = -1.5; // Offset to sit under typical models
            gridHelper.visible = state.grid;
            scene.add(gridHelper);
            
            // Set initial grid button UI state
            const gridBtn = document.getElementById('tool-grid');
            gridBtn.className = state.grid 
                ? 'tool-btn bg-blue-500/20 hover:bg-blue-500/40 text-blue-400 p-2 md:p-3 rounded-full transition-all active:scale-90'
                : 'tool-btn bg-white/5 hover:bg-white/20 p-2 md:p-3 rounded-full transition-all active:scale-90 text-white';

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;
            controls.maxDistance = 20;

            setupModelSelector();
            setupHdrPanel();
            
            // Load Default Environment
            const defaultEnv = hdrEnvironments.find(e => e.id === state.currentEnv);
            if (defaultEnv) loadEnvironment(defaultEnv);

            if(defaultModels.length > 0) loadModel(defaultModels[0].url);

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            document.getElementById('model-upload').addEventListener('change', onFileSelect);
            document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
            document.getElementById('rotate-btn').addEventListener('click', toggleRotation);
            
            // Toolbar Listeners
            document.getElementById('tool-camera').addEventListener('click', resetCamera);
            document.getElementById('tool-wireframe').addEventListener('click', toggleWireframe);
            document.getElementById('tool-grid').addEventListener('click', toggleGrid);
            document.getElementById('tool-env').addEventListener('click', toggleHdrPanel);
            
            // Zen Mode Listener and Dragging Setup
            setupZenBtnDrag();

            // Animation Listeners
            document.getElementById('btn-play-pause').addEventListener('click', toggleAnimation);
            document.getElementById('btn-stop').addEventListener('click', stopAnimation);

            setupScrollControls();
            animate();
        }

        // --- Blender-style Tools ---
        function resetCamera() {
            camera.position.set(0, 1.5, 5);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function toggleWireframe() {
            state.wireframe = !state.wireframe;
            const btn = document.getElementById('tool-wireframe');
            btn.className = state.wireframe 
                ? 'tool-btn bg-blue-500/20 hover:bg-blue-500/40 text-blue-400 p-2 md:p-3 rounded-full transition-all active:scale-90'
                : 'tool-btn bg-white/5 hover:bg-white/20 p-2 md:p-3 rounded-full transition-all active:scale-90 text-white';
            
            if (model) {
                model.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.material.wireframe = state.wireframe;
                    }
                });
            }
        }

        function toggleGrid() {
            state.grid = !state.grid;
            gridHelper.visible = state.grid;
            const btn = document.getElementById('tool-grid');
            btn.className = state.grid 
                ? 'tool-btn bg-blue-500/20 hover:bg-blue-500/40 text-blue-400 p-2 md:p-3 rounded-full transition-all active:scale-90'
                : 'tool-btn bg-white/5 hover:bg-white/20 p-2 md:p-3 rounded-full transition-all active:scale-90 text-white';
        }

        // --- Zen Mode Drag & Control ---
        function setupZenBtnDrag() {
            const zenBtn = document.getElementById('zen-btn');
            let isDraggingZen = false;
            let dragStartX, dragStartY;
            let btnStartX, btnStartY;
            let hasMoved = false;

            function onDragStart(e) {
                // Removed preventDefault here so the browser can register 'clicks' on touch screens
                isDraggingZen = true;
                hasMoved = false;
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                dragStartX = clientX;
                dragStartY = clientY;
                
                const rect = zenBtn.getBoundingClientRect();
                btnStartX = rect.left;
                btnStartY = rect.top;

                // Clear constraints so it follows purely top/left coordinates
                zenBtn.style.bottom = 'auto';
                zenBtn.style.right = 'auto';
                zenBtn.style.left = btnStartX + 'px';
                zenBtn.style.top = btnStartY + 'px';
            }

            function onDragMove(e) {
                if (!isDraggingZen) return;
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                const dx = clientX - dragStartX;
                const dy = clientY - dragStartY;

                // If moved more than a few pixels, consider it a drag (not a tap)
                if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
                    hasMoved = true;
                    zenBtn.classList.add('dragging');
                }

                if (hasMoved) {
                    // Prevent page scrolling ONLY when we know it's a drag
                    if (e.cancelable) e.preventDefault(); 
                    
                    let newX = btnStartX + dx;
                    let newY = btnStartY + dy;

                    // Keep within screen bounds
                    const maxX = window.innerWidth - zenBtn.offsetWidth;
                    const maxY = window.innerHeight - zenBtn.offsetHeight;
                    
                    newX = Math.max(0, Math.min(newX, maxX));
                    newY = Math.max(0, Math.min(newY, maxY));

                    zenBtn.style.left = newX + 'px';
                    zenBtn.style.top = newY + 'px';
                }
            }

            function onDragEnd(e) {
                if (!isDraggingZen) return;
                isDraggingZen = false;
                setTimeout(() => zenBtn.classList.remove('dragging'), 50);
            }

            // Attach listeners (passive: true allows default touch behaviors like clicking to work)
            zenBtn.addEventListener('mousedown', onDragStart);
            zenBtn.addEventListener('touchstart', onDragStart, { passive: true });
            
            window.addEventListener('mousemove', onDragMove, { passive: false });
            window.addEventListener('touchmove', onDragMove, { passive: false });
            
            window.addEventListener('mouseup', onDragEnd);
            window.addEventListener('touchend', onDragEnd);

            // Handle Clicks separately
            zenBtn.addEventListener('click', (e) => {
                if (hasMoved) {
                    // It was a drag, ignore the click
                    e.preventDefault();
                    e.stopPropagation();
                } else {
                    // It was a tap/click! Trigger Zen Mode
                    toggleZenMode();
                }
            });
        }

        function toggleZenMode() {
            const uiContainer = document.getElementById('ui-container');
            const isHidden = uiContainer.classList.toggle('ui-hidden');
            
            if (isHidden) {
                document.getElementById('icon-eye-open').classList.add('hidden');
                document.getElementById('icon-eye-closed').classList.remove('hidden');
            } else {
                document.getElementById('icon-eye-open').classList.remove('hidden');
                document.getElementById('icon-eye-closed').classList.add('hidden');
            }
        }

        // --- HDRI & Environment Controls ---
        function setupHdrPanel() {
            const panel = document.getElementById('hdr-panel');
            hdrEnvironments.forEach(env => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-all hover:bg-white/10 active:scale-95 ' + (env.id === state.currentEnv ? 'bg-blue-500/20 text-blue-400' : 'text-white/80');
                btn.textContent = env.name;
                btn.addEventListener('click', () => {
                    // Update active button styling
                    Array.from(panel.children).forEach(c => {
                        if(c.tagName === 'BUTTON') c.className = 'w-full text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-all hover:bg-white/10 active:scale-95 text-white/80';
                    });
                    btn.className = 'w-full text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-all hover:bg-white/10 active:scale-95 bg-blue-500/20 text-blue-400';
                    
                    loadEnvironment(env);
                    toggleHdrPanel(); // Close panel after selection
                });
                panel.appendChild(btn);
            });
        }

        function toggleHdrPanel() {
            const panel = document.getElementById('hdr-panel');
            state.isHdrPanelOpen = !state.isHdrPanelOpen;
            
            if (state.isHdrPanelOpen) {
                panel.classList.remove('opacity-0', 'pointer-events-none', 'scale-90');
                panel.classList.add('opacity-100', 'pointer-events-auto', 'scale-100');
            } else {
                panel.classList.add('opacity-0', 'pointer-events-none', 'scale-90');
                panel.classList.remove('opacity-100', 'pointer-events-auto', 'scale-100');
            }
        }

        function loadEnvironment(env) {
            state.currentEnv = env.id;
            const toolBtn = document.getElementById('tool-env');
            
            if (env.type === 'none') {
                scene.environment = null;
                scene.background = null; // Clear world background
                basicLights.forEach(l => scene.add(l));
                toolBtn.className = 'tool-btn bg-white/5 hover:bg-white/20 p-3 rounded-full transition-all active:scale-90 text-white';
                return;
            }
            
            toolBtn.className = 'tool-btn bg-blue-500/20 hover:bg-blue-500/40 text-blue-400 p-3 rounded-full transition-all active:scale-90';
            basicLights.forEach(l => scene.remove(l));

            if (env.type === 'room') {
                scene.environment = envTexture;
                scene.background = null; // Revert to sleek dark UI background for Studio mode
                return;
            }

            if (env.type === 'hdr') {
                loaderElement.classList.remove('hidden');
                new RGBELoader().load(env.url, function (texture) {
                    // Map the HDR as a 360-degree sphere around the scene
                    texture.mapping = THREE.EquirectangularReflectionMapping; 
                    
                    scene.environment = texture; // Apply to lighting/reflections
                    scene.background = texture;  // Apply to the visible world background
                    
                    loaderElement.classList.add('hidden');
                }, undefined, function (err) {
                    showError('Failed to load HDRI file.');
                    loaderElement.classList.add('hidden');
                });
            }
        }

        // --- Animation Control ---
        function toggleAnimation() {
            if(!activeAction) return;
            state.isPlaying = !state.isPlaying;
            activeAction.paused = !state.isPlaying;
            
            document.getElementById('icon-pause').classList.toggle('hidden');
            document.getElementById('icon-play').classList.toggle('hidden');
        }

        function stopAnimation() {
            if(!activeAction) return;
            activeAction.reset();
            activeAction.stop();
            state.isPlaying = false;
            document.getElementById('icon-pause').classList.add('hidden');
            document.getElementById('icon-play').classList.remove('hidden');
        }

        // --- Core Functions ---
        function loadModel(url) {
            const loader = new GLTFLoader();
            loaderElement.classList.remove('hidden');
            statsPanel.classList.add('hidden');
            animController.classList.add('hidden');
            animController.classList.remove('anim-ctrl-enter');
            
            if (model) {
                scene.remove(model);
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.geometry.dispose();
                        if (child.material.isMaterial) child.material.dispose();
                    }
                });
            }
            if (mixer) {
                mixer.stopAllAction();
                mixer = null;
                activeAction = null;
            }

            loader.load(url, (gltf) => {
                model = gltf.scene;
                
                // Calculate Stats
                let polygons = 0;
                let objects = 0;
                
                model.traverse((child) => {
                    if (child.isMesh) {
                        objects++;
                        if (child.geometry.index) polygons += child.geometry.index.count / 3;
                        else if (child.geometry.attributes.position) polygons += child.geometry.attributes.position.count / 3;
                        
                        // Apply current wireframe state
                        if(child.material) child.material.wireframe = state.wireframe;
                    }
                });
                
                statTris.textContent = polygons.toLocaleString(undefined, {maximumFractionDigits: 0});
                statObjs.textContent = objects.toLocaleString();
                statsPanel.classList.remove('hidden');

                // Center/Scale logic
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 3 / maxDim;

                model.scale.set(scale, scale, scale);
                model.position.sub(center.multiplyScalar(scale));
                
                // Adjust Grid position to bottom of model bounding box
                gridHelper.position.y = (box.min.y - center.y) * scale;
                
                scene.add(model);
                
                // Animations Setup
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    activeAction = mixer.clipAction(gltf.animations[0]);
                    activeAction.play();
                    state.isPlaying = true;
                    
                    document.getElementById('icon-pause').classList.remove('hidden');
                    document.getElementById('icon-play').classList.add('hidden');
                    
                    animController.classList.remove('hidden');
                    // Small delay to allow display:block before animating
                    setTimeout(() => animController.classList.add('anim-ctrl-enter'), 10);
                }

                resetCamera();
                loaderElement.classList.add('hidden');
            }, 
            undefined, 
            (error) => {
                showError('Failed to load model.');
                loaderElement.classList.add('hidden');
            });
        }

        // --- Standard UI Functions ---
        function setupScrollControls() {
            const scrollLeftBtn = document.getElementById('scroll-left');
            const scrollRightBtn = document.getElementById('scroll-right');
            let isDown = false, startX, scrollLeft;

            scrollLeftBtn.addEventListener('click', () => modelSelector.scrollBy({ left: -300, behavior: 'smooth' }));
            scrollRightBtn.addEventListener('click', () => modelSelector.scrollBy({ left: 300, behavior: 'smooth' }));

            modelSelector.addEventListener('mousedown', (e) => {
                isDown = true;
                modelSelector.classList.add('cursor-grabbing');
                startX = e.pageX - modelSelector.offsetLeft;
                scrollLeft = modelSelector.scrollLeft;
            });
            modelSelector.addEventListener('mouseleave', () => { isDown = false; modelSelector.classList.remove('cursor-grabbing'); });
            modelSelector.addEventListener('mouseup', () => { isDown = false; modelSelector.classList.remove('cursor-grabbing'); });
            modelSelector.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                modelSelector.scrollLeft = scrollLeft - ((e.pageX - modelSelector.offsetLeft) - startX) * 1.5;
            });
        }

        function setupModelSelector() {
            defaultModels.forEach(modelData => {
                const button = document.createElement('button');
                button.className = 'inline-flex items-center justify-center bg-white/5 hover:bg-white/15 border border-white/5 text-white/90 font-medium py-2 px-4 md:py-3 md:px-6 rounded-xl md:rounded-2xl shadow-sm transition-all duration-300 ease-out active:scale-90 focus:outline-none focus:ring-2 focus:ring-blue-400/50 flex-shrink-0 text-xs md:text-base';
                button.textContent = modelData.name;
                button.addEventListener('click', () => loadModel(modelData.url));
                modelSelector.appendChild(button);
            });
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorToast.classList.remove('hidden');
            errorToast.classList.add('toast-enter');
            setTimeout(() => {
                errorToast.classList.add('hidden');
                errorToast.classList.remove('toast-enter');
            }, 5000);
        }

        function onFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                loadModel(url);
                event.target.value = '';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        function toggleRotation() {
            controls.autoRotate = !controls.autoRotate;
            const btn = document.getElementById('rotate-btn');
            controls.autoRotate ? btn.classList.replace('text-white', 'text-blue-400') : btn.classList.replace('text-blue-400', 'text-white');
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
